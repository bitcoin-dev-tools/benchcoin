# Default PR-style experiment.
#
# Usage:
#   bench.py experiment run bench/experiments/pr.toml \
#     --datadir /data/pruned-840k --output-dir ./output

[experiment]
name = "direct-ab-7dcb7f09ed6"
outputs = ["results", "differential-flamegraph", "debug-plots"]

[benchmark]
start_height = 840000
runs = 1

[bitcoind]
stopatheight = 900000
chain = "main"
connect = "148.251.128.115:33333"
prune = 1000000
daemon = false
printtoconsole = false

[bitcoind.instrumented]
debug = ["coindb", "leveldb", "bench", "validation"]

[[subjects]]
name = "parent"
commit = "5e8586ec5b01abaa6289eee1b551245425e8fffb"

[[profiles]]
name = "450-instrumented"
dbcache = 450
instrumentation = true

[[subjects]]
name = "change"
commit = "7dcb7f09ed64f9815a533e97cf9d42bc5c0186ad"

[[comparisons]]
name = "parent-vs-change"
before = "parent"
after = "change"
profiles = ["450-instrumented"]
outputs = ["differential-flamegraph"]
